name: Receber Base PCM

on:
  repository_dispatch:
    types:
      - pcm_base_chunk
      - pcm_base_finalize

permissions:
  contents: write

concurrency:
  group: pcm-base-update
  cancel-in-progress: false

jobs:
  receber-base:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validar payload recebido
        run: |
          echo "Evento recebido: ${{ github.event.action }}"
          echo "Base name: ${{ github.event.client_payload.base_name }}"
          echo "Target path: ${{ github.event.client_payload.target_path }}"
          echo "Lote ID: ${{ github.event.client_payload.lote_id }}"
          echo "Part index: ${{ github.event.client_payload.part_index }}"
          echo "Total parts: ${{ github.event.client_payload.total_parts }}"

      - name: Receber parte do arquivo
        if: github.event.action == 'pcm_base_chunk'
        env:
          BASE_NAME: ${{ github.event.client_payload.base_name }}
          TARGET_PATH: ${{ github.event.client_payload.target_path }}
          LOTE_ID: ${{ github.event.client_payload.lote_id }}
          PART_INDEX: ${{ github.event.client_payload.part_index }}
          TOTAL_PARTS: ${{ github.event.client_payload.total_parts }}
          CHUNK_B64: ${{ github.event.client_payload.chunk_b64 }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_NAME" ]; then
            echo "base_name não informado."
            exit 1
          fi

          if [ -z "$TARGET_PATH" ]; then
            echo "target_path não informado."
            exit 1
          fi

          if [ -z "$LOTE_ID" ]; then
            echo "lote_id não informado."
            exit 1
          fi

          if [ -z "$PART_INDEX" ]; then
            echo "part_index não informado."
            exit 1
          fi

          if [ -z "$TOTAL_PARTS" ]; then
            echo "total_parts não informado."
            exit 1
          fi

          if [ -z "$CHUNK_B64" ]; then
            echo "chunk_b64 não informado."
            exit 1
          fi

          SAFE_BASE=$(echo "$BASE_NAME" | tr -c 'A-Za-z0-9_.-' '_')
          SAFE_LOTE=$(echo "$LOTE_ID" | tr -c 'A-Za-z0-9_.-' '_')

          CHUNK_DIR=".github/pcm-chunks/${SAFE_BASE}/${SAFE_LOTE}"

          mkdir -p "$CHUNK_DIR"

          echo "$TARGET_PATH" > "$CHUNK_DIR/target_path.txt"
          echo "$TOTAL_PARTS" > "$CHUNK_DIR/total_parts.txt"
          echo "$BASE_NAME" > "$CHUNK_DIR/base_name.txt"

          printf "%s" "$CHUNK_B64" > "$CHUNK_DIR/part_${PART_INDEX}.b64"

          echo "Parte recebida com sucesso:"
          echo "Base: $BASE_NAME"
          echo "Lote: $LOTE_ID"
          echo "Parte: $PART_INDEX de $TOTAL_PARTS"
          echo "Diretório: $CHUNK_DIR"

          git add "$CHUNK_DIR"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi

          git commit -m "Recebe chunk ${PART_INDEX}/${TOTAL_PARTS} - ${BASE_NAME} - ${LOTE_ID}"

          git pull --rebase origin main
          git push origin main

      - name: Finalizar arquivo JSON
        if: github.event.action == 'pcm_base_finalize'
        env:
          BASE_NAME: ${{ github.event.client_payload.base_name }}
          TARGET_PATH: ${{ github.event.client_payload.target_path }}
          LOTE_ID: ${{ github.event.client_payload.lote_id }}
          TOTAL_PARTS: ${{ github.event.client_payload.total_parts }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_NAME" ]; then
            echo "base_name não informado no finalize."
            exit 1
          fi

          if [ -z "$TARGET_PATH" ]; then
            echo "target_path não informado no finalize."
            exit 1
          fi

          if [ -z "$LOTE_ID" ]; then
            echo "lote_id não informado no finalize."
            exit 1
          fi

          if [ -z "$TOTAL_PARTS" ]; then
            echo "total_parts não informado no finalize."
            exit 1
          fi

          SAFE_BASE=$(echo "$BASE_NAME" | tr -c 'A-Za-z0-9_.-' '_')
          SAFE_LOTE=$(echo "$LOTE_ID" | tr -c 'A-Za-z0-9_.-' '_')

          CHUNK_DIR=".github/pcm-chunks/${SAFE_BASE}/${SAFE_LOTE}"
          TEMP_FILE="${CHUNK_DIR}/arquivo_montado.json"

          echo "Finalizando arquivo:"
          echo "Base: $BASE_NAME"
          echo "Lote: $LOTE_ID"
          echo "Target: $TARGET_PATH"
          echo "Total de partes: $TOTAL_PARTS"
          echo "Diretório dos chunks: $CHUNK_DIR"

          if [ ! -d "$CHUNK_DIR" ]; then
            echo "Diretório de chunks não encontrado: $CHUNK_DIR"
            exit 1
          fi

          : > "$TEMP_FILE"

          LAST_INDEX=$((TOTAL_PARTS - 1))

          for INDEX in $(seq 0 "$LAST_INDEX"); do
            PART_FILE="$CHUNK_DIR/part_${INDEX}.b64"

            if [ ! -f "$PART_FILE" ]; then
              echo "Parte ausente: $PART_FILE"
              echo "Não é seguro montar o JSON incompleto."
              exit 1
            fi

            echo "Adicionando parte $INDEX..."
            base64 -d "$PART_FILE" >> "$TEMP_FILE"
          done

          echo "Validando JSON montado..."

          if ! jq empty "$TEMP_FILE"; then
            echo "JSON final inválido. O arquivo não será publicado."
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "$TEMP_FILE" "$TARGET_PATH"

          echo "Arquivo publicado em: $TARGET_PATH"

          rm -rf "$CHUNK_DIR"

          git add "$TARGET_PATH" ".github/pcm-chunks"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi

          git commit -m "Atualiza ${BASE_NAME} - ${LOTE_ID}"

          git pull --rebase origin main
          git push origin main
